<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Santa — GIVYA</title>
<meta name="theme-color" content="#7A3FF5">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="pagehead" id="ph"><a class="back" href="/"><span class="ms">arrow_back</span></a><h1 id="h1">Secret Santa</h1></div>
  <div id="body"><div class="empty">Loading…</div></div>
</div>
<nav class="tabs">
  <a href="/"><span class="ico" ms>home</span>Home</a>
  <a href="wishlist.html"><span class="ico" ms>redeem</span>Wishlist</a>
  <a href="marketplace.html"><span class="ico" ms>shopping_bag</span>Market</a>
  <a href="santa.html" class="on"><span class="ico" ms>ac_unit</span>Santa</a>
  <a href="me.html"><span class="ico" ms>person</span>Me</a>
</nav>
<div class="modal" id="gSheet" style="display:none"><div class="sheet">
  <div class="spread mb"><h2>New Secret Santa group</h2><button class="iconbtn" onclick="closeSheet()"><span class="ms">close</span></button></div>
  <label>Group name</label><input id="gName" placeholder="e.g. Office Christmas 2026">
  <button class="btn mt" onclick="createGroup()">Create group</button>
  <p class="small mt">Add your people, tap Draw, and everyone gets a secret match.</p>
</div></div>
<div class="modal" id="mSheet" style="display:none"><div class="sheet">
  <div class="spread mb"><h2>Add a participant</h2><button class="iconbtn" onclick="closeSheet()"><span class="ms">close</span></button></div>
  <label>Name</label><input id="mName" placeholder="e.g. Tolu">
  <button class="btn mt" onclick="addMember()">Add</button>
</div></div>
<script src="app.js"></script>
<script>
const params=new URLSearchParams(location.search);
let GROUP=null,MEMBERS=[],IS_OWNER=false;
async function boot(){
  const g=params.get('g'),p=params.get('p');
  if(g&&p)return memberView(g,p);
  if(g)return groupView(g,false);
  document.body.insertAdjacentHTML('beforeend',GV.gateHTML());
  if(!await GV.needAuth())return;
  await gvInitHeader();
  const {data:groups}=await sb.from('givya_santa_groups').select('*').eq('owner_id',GV.user.id).order('created_at',{ascending:false});
  const box=document.getElementById('body');
  if(!groups||!groups.length){box.innerHTML='<div class="empty">Santa season loading… 🎅<br><button class="btn slim mt" onclick="openSheet()">Start a group</button><br><span class="small" style="display:inline-block;margin-top:8px">Perfect for offices, friends and family.</span></div>';return;}
  box.innerHTML=groups.map(g=>'<a class="card" style="display:block;margin-bottom:12px" href="santa.html?g='+g.id+'"><div class="spread"><div><b style="font-size:15px">'+esc(g.name)+'</b></div><span class="badge">Open <span class="ms" style="font-size:11px">arrow_forward</span></span></div></a>').join('');
}
async function memberView(gid,pid){
  document.getElementById('ph').innerHTML='<a class="back" href="/"><span class="ms">arrow_back</span></a><h1 style="font-size:18px">Your Santa match</h1>';
  const {data:m}=await sb.from('givya_santa_members').select('*').eq('id',pid).eq('group_id',gid).maybeSingle();
  const box=document.getElementById('body');
  if(!m){box.innerHTML='<div class="empty">This link is not valid. Ask the organizer for a fresh one.</div>';return;}
  box.innerHTML='<div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:44px">🎅</div><h2 style="margin:10px 0 4px;font-size:19px">Hi '+esc(m.name)+'</h2><p class="sub">You are Secret Santa for</p><div style="font-size:26px;font-weight:800;margin:10px 0;color:#6A2FE8">'+esc(m.assigned_to||'…')+'</div><p class="small">Keep it secret! Find them a gift they will love.</p><a class="btn ghost mt" href="marketplace.html">Browse gift ideas</a></div>';
}
async function groupView(gid,checkOwner=true){
  const {data:g}=await sb.from('givya_santa_groups').select('*').eq('id',gid).maybeSingle();
  if(!g){document.getElementById('body').innerHTML='<div class="empty">Group not found.</div>';return;}
  GROUP=g;
  if(checkOwner){await GV.init();IS_OWNER=!!(GV.user&&GV.user.id===g.owner_id);}
  document.getElementById('ph').innerHTML=(IS_OWNER?'<a class="back" href="santa.html"><span class="ms">arrow_back</span></a>':'<a class="back" href="/"><span class="ms">arrow_back</span></a>')+'<h1 style="font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(g.name)+'</h1>';
  const {data:ms}=await sb.from('givya_santa_members').select('*').eq('group_id',gid).order('created_at');
  MEMBERS=ms||[];
  const box=document.getElementById('body');
  let html='<div class="small mb">'+MEMBERS.length+' participant'+(MEMBERS.length===1?'':'s')+'</div>';
  if(!IS_OWNER){box.innerHTML=html+'<div class="empty">The draw for this group is private.<br><span class="small" style="display:inline-block;margin-top:8px">Participants open their own personal link to see who they are gifting.</span></div>';return;}
  if(!MEMBERS.length)html+='<div class="empty">No participants yet.<br><button class="btn slim mt" onclick="openMSheet()">Add your people</button></div>';
  else html+=MEMBERS.map(m=>{
    const link=GV.shareLink('santa.html','g='+gid+'&p='+m.id);
    return '<div class="item"><div class="thumb">🧑🏾</div><div class="info"><b>'+esc(m.name)+'</b><small>'+(m.assigned_to?'gifting '+esc(m.assigned_to):'not drawn yet')+'</small></div><button class="iconbtn" onclick="copyLink(\''+link+'\')"><span class="ms">link</span></button></div>';
  }).join('');
  html+='<div class="row mt"><button class="btn" onclick="draw()">Draw names</button><button class="btn ghost" onclick="openMSheet()">Add person</button></div>';
  if(MEMBERS.length&&MEMBERS.some(m=>m.assigned_to))html+='<p class="small" style="text-align:center;margin-top:10px">Share each person their link above. Drawing again reshuffles everyone.</p>';
  box.innerHTML=html;
}
function copyLink(l){navigator.clipboard.writeText(l);GV.toast('Link copied — send it to them');}
async function createGroup(){
  const n=document.getElementById('gName').value.trim();if(!n)return GV.toast('Name the group first');
  const {data,error}=await sb.from('givya_santa_groups').insert({owner_id:GV.user.id,name:n}).select().single();
  if(error)return GV.toast('Could not create, try again');
  closeSheet();location.href='santa.html?g='+data.id;
}
function openMSheet(){document.getElementById('mSheet').style.display='flex';}
async function addMember(){
  const n=document.getElementById('mName').value.trim();if(!n)return GV.toast('Add a name first');
  const {error}=await sb.from('givya_santa_members').insert({group_id:GROUP.id,name:n});
  if(error)return GV.toast('Could not add, try again');
  document.getElementById('mName').value='';closeSheet();groupView(GROUP.id,false);
}
async function draw(){
  if(MEMBERS.length<2)return GV.toast('Add at least 2 people to draw');
  const sh=[...MEMBERS];
  for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
  for(let i=0;i<sh.length;i++){
    const target=sh[(i+1)%sh.length].name;
    await sb.from('givya_santa_members').update({assigned_to:target}).eq('id',sh[i].id);
  }
  GV.toast('Names drawn 🎅');groupView(GROUP.id,false);
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openSheet(){document.getElementById('gSheet').style.display='flex';}
function closeSheet(){document.getElementById('gSheet').style.display='none';document.getElementById('mSheet').style.display='none';}
boot();
</script>
</body></html>
