<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlists — GIVYA</title>
<meta name="theme-color" content="#7A3FF5">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="pagehead" id="ph"><a class="back" href="/"><span class="ms">arrow_back</span></a><h1 id="h1">My wishlists</h1><span style="flex:1"></span><button class="iconbtn" onclick="openSheet('wlSheet')" id="addBtn" title="New wishlist"><span class="ms">add</span></button></div>
  <div id="body"></div>
</div>
<nav class="tabs">
  <a href="/"><span class="ico ms">home</span>Home</a>
  <a href="wishlist.html" class="on"><span class="ico ms">redeem</span>Wishlist</a>
  <a href="marketplace.html"><span class="ico ms">shopping_bag</span>Market</a>
  <a href="santa.html"><span class="ico ms">ac_unit</span>Santa</a>
  <a href="me.html"><span class="ico ms">person</span>Me</a>
</nav>

<div class="modal" id="wlSheet" style="display:none"><div class="sheet">
  <div class="spread mb"><h2>New wishlist</h2><button class="iconbtn" onclick="closeSheet('wlSheet')"><span class="ms">close</span></button></div>
  <label>What is the list for?</label><input id="wlTitle" placeholder="e.g. My birthday, Housewarming">
  <label>Occasion (optional)</label><input id="wlOcc" placeholder="e.g. Birthday — Feb 14">
  <button class="btn mt" onclick="createWl()">Create wishlist</button>
</div></div>

<div class="modal" id="itemSheet" style="display:none"><div class="sheet">
  <div class="spread mb"><h2>Add a gift idea</h2><button class="iconbtn" onclick="closeSheet('itemSheet')"><span class="ms">close</span></button></div>
  <label>Item name</label><input id="itTitle" placeholder="e.g. Wireless earbuds">
  <label>Price (₦, optional)</label><input id="itPrice" inputmode="decimal" placeholder="e.g. 25000">
  <label>Link (optional)</label><input id="itLink" placeholder="Paste a link to the item">
  <label>Image link (optional)</label><input id="itImg" placeholder="Paste an image URL">
  <label>Note (optional)</label><input id="itNote" placeholder="e.g. Any colour is fine">
  <button class="btn mt" onclick="addItem()">Add to wishlist <span class="badge" style="background:rgba(255,255,255,.2);color:#fff">+10 pts</span></button>
</div></div>

<script src="app.js"></script>
<script>
const params=new URLSearchParams(location.search);
let W=null,ITEMS=[],CLAIMS={};
async function boot(){
  document.body.insertAdjacentHTML('beforeend',GV.gateHTML());
  if(!await GV.needAuth())return;
  await gvInitHeader();
  const id=params.get('id');
  if(id)return detail(id);
  listAll();
}
async function listAll(){
  document.getElementById('h1').textContent='My wishlists';
  document.getElementById('addBtn').style.display='flex';
  const {data:wls}=await sb.from('givya_wishlists').select('*').eq('owner_id',GV.user.id).order('created_at',{ascending:false});
  const box=document.getElementById('body');
  if(!wls||!wls.length){box.innerHTML='<div class="empty">No wishlist yet.<br><button class="btn slim mt" onclick="openSheet(\'wlSheet\')">Create your first wishlist</button><br><span class="small" style="display:inline-block;margin-top:8px">+20 points when you do <span class="ms">auto_awesome</span></span></div>';return;}
  const {data:items}=await sb.from('givya_wishlist_items').select('id,wishlist_id,status').in('wishlist_id',wls.map(w=>w.id));
  const cnt={};(items||[]).forEach(i=>{cnt[i.wishlist_id]=cnt[i.wishlist_id]||{n:0,r:0};cnt[i.wishlist_id].n++;if(i.status==='claimed')cnt[i.wishlist_id].r++;});
  box.innerHTML=wls.map(w=>{const c=cnt[w.id]||{n:0,r:0};return '<a class="card" style="display:block;margin-bottom:12px" href="wishlist.html?id='+w.id+'"><div class="spread"><div><b style="font-size:15px">'+esc(w.title)+'</b><div class="small">'+(w.occasion?esc(w.occasion)+' · ':'')+c.n+' gift'+(c.n===1?'':'s')+(c.r?', '+c.r+' reserved':'')+'</div></div><span class="badge">Open <span class="ms" style="font-size:11px">arrow_forward</span></span></div></a>';}).join('')+'<div class="small" style="text-align:center;margin-top:10px">Every list gets a private share link for your people.</div>';
}
async function detail(id){
  document.getElementById('ph').innerHTML='<a class="back" href="wishlist.html"><span class="ms">arrow_back</span></a><h1 style="font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="h1t">…</h1><button class="iconbtn" id="shareBtn" title="Share"><span class="ms">outbox</span></button>';
  const {data:w}=await sb.from('givya_wishlists').select('*').eq('id',id).eq('owner_id',GV.user.id).maybeSingle();
  if(!w){document.getElementById('body').innerHTML='<div class="empty">Wishlist not found.</div>';return;}
  W=w;document.getElementById('h1t').textContent=w.title;
  document.getElementById('addBtn').style.display='flex';
  document.getElementById('addBtn').onclick=()=>openSheet('itemSheet');
  document.getElementById('shareBtn').onclick=()=>gvShare(GV.shareLink('wishlist-view.html','w='+w.share_token));
  await loadItems();
}
async function loadItems(){
  const {data:items}=await sb.from('givya_wishlist_items').select('*').eq('wishlist_id',W.id).order('created_at',{ascending:false});
  ITEMS=items||[];
  CLAIMS={};
  if(ITEMS.length){
    const {data:cl}=await sb.from('givya_claims').select('*').in('item_id',ITEMS.map(i=>i.id)).order('created_at',{ascending:false});
    (cl||[]).forEach(c=>{if(!CLAIMS[c.item_id])CLAIMS[c.item_id]=c;});
  }
  const box=document.getElementById('body');
  let html='<div class="small mb">'+esc(W.occasion||'Your gift list')+' · share link gives friends a clean view to reserve from</div>';
  if(!ITEMS.length)html+='<div class="empty">Nothing on this list yet.<br><button class="btn slim mt" onclick="openSheet(\'itemSheet\')">Add a gift idea</button></div>';
  else html+=ITEMS.map(i=>{
    const c=CLAIMS[i.id];
    const thumb=i.image_url?'<img src="'+esc(i.image_url)+'" onerror="this.remove()">':'🎁';
    let act='';
    if(c)act='<span class="badge res">Reserved'+(c.claimer_name?' by '+esc(c.claimer_name):'')+'</span><br><button class="btn slim ghost" style="margin-top:6px" onclick="release(\''+i.id+'\')">Release</button>';
    else act='<span class="badge">Open</span>';
    return '<div class="item"><div class="thumb">'+thumb+'</div><div class="info"><b>'+esc(i.title)+'</b><small>'+(i.price?GV.naira(i.price)+' · ':'')+esc(i.note||'')+'</small>'+(i.link?' · <a href="'+esc(i.link)+'" target="_blank" style="color:#6A2FE8;font-weight:700">open link</a>':'')+'</div><div style="text-align:right">'+act+'<br><button class="iconbtn" style="margin-top:6px" onclick="delItem(\''+i.id+'\')"><span class="ms">delete</span></button></div></div>';
  }).join('');
  box.innerHTML=html;
}
async function createWl(){
  const t=document.getElementById('wlTitle').value.trim();if(!t)return GV.toast('Give the list a name first');
  const {data,error}=await sb.from('givya_wishlists').insert({owner_id:GV.user.id,title:t,occasion:document.getElementById('wlOcc').value.trim()||null}).select().single();
  if(error)return GV.toast('Could not create, try again');
  closeSheet('wlSheet');await GV.refreshPoints();GV.toast('Wishlist created · +20 points');location.href='wishlist.html?id='+data.id;
}
async function addItem(){
  const t=document.getElementById('itTitle').value.trim();if(!t)return GV.toast('What is the gift?');
  const row={wishlist_id:W.id,title:t,price:document.getElementById('itPrice').value.replace(/[^0-9.]/g,'')||null,link:document.getElementById('itLink').value.trim()||null,image_url:document.getElementById('itImg').value.trim()||null,note:document.getElementById('itNote').value.trim()||null};
  const {error}=await sb.from('givya_wishlist_items').insert(row);
  if(error)return GV.toast('Could not add, try again');
  ['itTitle','itPrice','itLink','itImg','itNote'].forEach(id=>document.getElementById(id).value='');
  closeSheet('itemSheet');await GV.refreshPoints();GV.toast('Added · +10 points');loadItems();
}
async function delItem(id){if(!confirm('Remove this item?'))return;await sb.from('givya_wishlist_items').delete().eq('id',id);loadItems();GV.toast('Removed');}
async function release(id){await sb.from('givya_claims').delete().eq('item_id',id);await sb.from('givya_wishlist_items').update({status:'open'}).eq('id',id);loadItems();GV.toast('Reservation released');}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openSheet(id){document.getElementById(id).style.display='flex';}
function closeSheet(id){document.getElementById(id).style.display='none';}
boot();
</script>
</body></html>
