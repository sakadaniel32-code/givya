<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIVYA — Wishlist</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--violet:#834DFB;--vd:#6a35e0;--inkd:#3c1d9e;--turbo:#F0E100;--haiti:#18102B;--soft:#55496e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--haiti);min-height:100vh;-webkit-font-smoothing:antialiased;
background:radial-gradient(60% 30% at 90% -5%,rgba(131,77,251,.18),transparent 60%),radial-gradient(45% 30% at -5% 100%,rgba(240,225,100,.25),transparent 60%),linear-gradient(175deg,#fbf9ff,#f1ecff 55%,#faf8ff)}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font-size:22px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(115deg,#8f5bff 20%,#3c1d9e 80%);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.logo span{color:transparent;background:linear-gradient(115deg,#f6ea33,#d9b400);-webkit-background-clip:text;background-clip:text}
header a{font-size:13px;font-weight:700;color:var(--vd);text-decoration:none}
.banner{border-radius:24px;padding:24px;color:#fff;position:relative;overflow:hidden;margin-top:10px;
background:radial-gradient(70% 90% at 88% 12%,rgba(240,225,100,.35),transparent 55%),radial-gradient(120% 120% at -10% 110%,rgba(58,24,150,.9),transparent 60%),linear-gradient(125deg,#8f5bff,#6a35e0 55%,#3c1d9e);box-shadow:0 20px 44px rgba(60,29,158,.35)}
.banner .oc{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.banner h1{font-size:26px;font-weight:800;margin:8px 0 4px}
.banner .s{font-size:13px;opacity:.9}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.meta span{font-size:10.5px;font-weight:800;border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.18)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec h2{font-size:16px;font-weight:800}
.sec span{font-size:11.5px;font-weight:700;color:var(--vd)}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);border:1px solid rgba(131,77,251,.10);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 8px 20px rgba(60,29,158,.07)}
.item .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,#a06bff,#3c1d9e);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item.cl .ic{background:linear-gradient(140deg,#f6ea33,#d9b400)}
.item .nm{font-weight:700;font-size:13.5px}
.item .pz{font-size:12px;color:var(--soft);margin-top:2px}
.item .bys{font-size:10.5px;font-weight:800;color:#0d8a52;margin-top:2px}
.claim{margin-left:auto;border:none;border-radius:999px;font:inherit;font-size:12px;font-weight:800;padding:10px 16px;cursor:pointer;background:linear-gradient(120deg,#8f5bff,#5b2fe0);color:#fff;box-shadow:0 8px 18px rgba(60,29,158,.3);flex-shrink:0}
.item.cl{opacity:.75}
.item.cl .claim{background:rgba(237,233,250,1);color:#0d8a52;box-shadow:none;cursor:default}
.wa{display:block;text-align:center;background:#25d366;color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:14px;text-decoration:none;margin-top:20px}
.mine{display:block;text-align:center;margin-top:12px;font-size:13px;font-weight:700;color:var(--vd);text-decoration:none}
.note{margin-top:14px;font-size:11px;color:#8d84a8;text-align:center}
.load{margin:40px auto;text-align:center;color:var(--soft);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html">GIVYA<span>.</span></a><a href="app.html">Make your own →</a></header>
<div class="load" id="load">Loading the wishlist…</div>
<div id="page" style="display:none">
  <div class="banner">
    <div class="oc" id="bOcc">BIRTHDAY</div>
    <h1 id="bTitle">—</h1>
    <div class="s" id="bSub">—</div>
    <div class="meta"><span id="bBy">from —</span><span id="bCount">— items</span><span id="bLeft">— unclaimed</span></div>
  </div>
  <div class="sec"><h2>The gifts</h2><span id="hintTxt">tap claim, add your name, done</span></div>
  <div id="items"></div>
  <a class="wa" id="waLink" target="_blank">Share this wishlist on WhatsApp →</a>
  <a class="mine" href="app.html">✨ Make your own wishlist</a>
  <p class="note">GIVYA v1 beta · gifts are claimed in good faith, payment settles outside for now</p>
</div>
</div>
<script>
const SB=supabase.createClient('https://wyffeifapgjyndsickzw.supabase.co','sb_publishable_-l_aiV-1dwtGWg9wmm3vig_72yl4HgL');
const slug=new URLSearchParams(location.search).get('w');
const money=n=>n?'₦'+Number(n).toLocaleString('en-NG'):'';
async function run(){
  if(!slug){document.getElementById('load').textContent='No wishlist found here. Make your own at app.html.';return;}
  const {data:wl,error:e}=await SB.from('givya_wishlists').select('*').eq('slug',slug).maybeSingle();
  if(e||!wl){document.getElementById('load').textContent='This wishlist does not exist (or the link broke). Check the link, or start your own.';return;}
  const {data:items}=await SB.from('givya_wishlist_items').select('*').eq('wishlist_id',wl.id).order('created_at');
  document.getElementById('load').style.display='none';
  document.getElementById('page').style.display='block';
  document.getElementById('bOcc').textContent=(wl.occasion||'GIFTING').toUpperCase();
  document.getElementById('bTitle').textContent=wl.title;
  document.getElementById('bSub').textContent=`Gifts for ${wl.person_name}`;
  document.getElementById('bBy').textContent='from '+(wl.owner_name||'a friend');
  const un=items.filter(i=>!i.claimed).length;
  document.getElementById('bCount').textContent=items.length+' items';
  document.getElementById('bLeft').textContent=un+' unclaimed';
  document.getElementById('waLink').href='https://wa.me/?text='+encodeURIComponent(`🎁 ${wl.title} is live on GIVYA. Claim a gift before someone else does: ${location.href}`);
  const box=document.getElementById('items');box.innerHTML='';
  items.forEach(it=>{
    const d=document.createElement('div');d.className='item'+(it.claimed?' cl':'');
    d.innerHTML=`<div class="ic">${it.claimed?'✅':'🎁'}</div><div><div class="nm">${esc(it.name)}</div><div class="pz">${money(it.price)}</div>${it.claimed?`<div class="bys">claimed by ${esc(it.claimed_by||'someone')}</div>`:''}</div><button class="claim">${it.claimed?'Claimed':'Claim this'}</button>`;
    if(!it.claimed){d.querySelector('.claim').onclick=async()=>{
      const who=prompt('Your name (they will see who claimed it):');if(!who)return;
      const {error:ue}=await SB.from('givya_wishlist_items').update({claimed:true,claimed_by:who.trim()}).eq('id',it.id);
      if(ue){alert('Could not claim it, try again.');return;}
      run();};}
    box.appendChild(d);
  });
  document.title=`${wl.title} — GIVYA Wishlist`;
}
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
run();
</script>
</body>
</html>
